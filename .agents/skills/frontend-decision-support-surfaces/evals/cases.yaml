version: 1
skill: "frontend-decision-support-surfaces"
cases:
  # --- Positive activation: a human works a queue and commits a decision ---
  # Calibration note: the runner scores a prompt against this skill's description with the
  # negative-routing clause stripped, plus its tags -- never the body. So a positive case
  # is a test of the DESCRIPTION's trigger vocabulary, and every prompt below was measured
  # against that scorer rather than guessed. If an edit to the description drops a trigger
  # term, the case that depended on it goes red, which is the regression signal wanted.
  - id: positive-trigger-approval-queue
    type: activation
    prompt: "Build an approval queue where a reviewer claims an item and approves or rejects it"
    expect:
      activates: true

  - id: positive-trigger-moderation-queue
    type: activation
    prompt: "We need a content moderation queue with a required rationale and an audit trail"
    expect:
      activates: true

  - id: positive-trigger-triage
    type: activation
    prompt: "Design the triage queue screen: claim an item, review the evidence, then route or escalate"
    expect:
      activates: true

  - id: positive-trigger-fila-pt
    type: activation
    prompt: "Preciso de uma tela de fila de aprovação com histórico, audit trail e motivo obrigatório"
    expect:
      activates: true

  - id: positive-trigger-triagem-pt
    type: activation
    prompt: "Montar a tela de triagem: o analista assume um item da fila de aprovação"
    expect:
      activates: true

  - id: positive-trigger-optimistic-conflict
    type: activation
    prompt: "Our review queue returns a 409 when two people commit a decision on the same item"
    expect:
      activates: true

  - id: positive-trigger-hitl-review
    type: activation
    prompt: "Build a human-in-the-loop review queue where the model suggests an action and a person confirms or overrides it"
    expect:
      activates: true

  - id: positive-trigger-four-eyes
    type: activation
    prompt: "Add four-eyes approval so the person who submitted cannot be the person who authorizes"
    expect:
      activates: true

  - id: positive-trigger-claim-sla
    type: activation
    prompt: "Our review queue needs claim/assignment, SLA aging and skip/defer/escalate actions"
    expect:
      activates: true

  - id: positive-trigger-board-variant
    type: activation
    prompt: "Kanban board for our review queue where dragging a card commits a decision — accessibility and rollback?"
    expect:
      activates: true

  # --- Negative activation: the neighbours named in the description keep their traffic.
  # These are the anchors the description's negative scope points at; the scorer strips
  # negative clauses, so each one is asserted here instead.
  - id: negative-trigger-metrics-dashboard
    type: activation
    prompt: "Architect our in-app admin dashboard on live data with URL filters and a virtualized table"
    expect:
      activates: false

  - id: negative-trigger-kpi-monitoring
    type: activation
    prompt: "Add KPI cards with delta and trend plus a responsive collapse order to our product dashboard"
    expect:
      activates: false

  - id: negative-trigger-confidence-widget
    type: activation
    prompt: "How should we display model confidence and a hallucination disclosure to build user trust?"
    expect:
      activates: false

  - id: negative-trigger-dialogue-design
    type: activation
    prompt: "Design the chatbot persona, tone and fallback repair strategy for our assistant"
    expect:
      activates: false

  - id: negative-trigger-cluttered-screen
    type: activation
    prompt: "make this cluttered admin screen breathable"
    expect:
      activates: false

  - id: negative-trigger-canvas-suggestions
    type: activation
    prompt: "In canvas mode the user should accept or reject the AI's inline edits to the document text"
    expect:
      activates: false

  - id: negative-trigger-single-file-dashboard
    type: activation
    prompt: "single-file HTML dashboard I can email"
    expect:
      activates: false

  # --- Output checks: the bundle and the load-bearing corrections must survive edits ---
  - id: output-bundle-present
    type: output
    prompt: "Which reference files does this skill ship?"
    expect:
      checks:
        - kind: file_exists
          path: references/queue-mechanics-and-board-variant.md
        - kind: file_exists
          path: references/decision-commit-integrity.md
        - kind: file_exists
          path: references/hitl-and-supervision.md
        - kind: file_exists
          path: references/audit-log-investigation.md
        - kind: file_exists
          path: references/worked-example-approval-queue.md
        - kind: no_secrets

  - id: output-commit-path-invariants
    type: output
    prompt: "Build an approval queue where a reviewer claims an item and commits a decision"
    expect:
      checks:
        - kind: contains_keywords
          keywords:
            - "lease"
            - "409"
            - "rationale"
            - "audit"
            - "expected_state"
            - "assertive"
        # The dashboards/decision seam is the routing risk this skill exists to fix.
        # If a future edit drops it, routing regresses before anyone notices.
        - kind: contains_keywords
          keywords:
            - "frontend-dashboards"
        - kind: no_secrets

  - id: output-board-accessibility-not-optional
    type: output
    prompt: "We want a kanban board for this queue"
    expect:
      checks:
        # Board layout is practice-labelled, but SC 2.5.7 is a hard AA requirement.
        # A sweep that softens this into "consider keyboard support" should fail here.
        - kind: contains_keywords
          keywords:
            - "2.5.7"
            - "single pointer"
        - kind: no_secrets

  - id: output-no-unsourced-thresholds
    type: output
    prompt: "How long should a reviewer work a queue, and what is a healthy override rate?"
    expect:
      checks:
        # Cut under the sourcing contract: no primary source exists for reviewer-fatigue
        # thresholds, queue-length caps, batch sizes, or a numeric override-rate target.
        # Reintroducing any of them should fail here rather than ship.
        - kind: not_contains
          keywords:
            - "healthy override rate of"
            - "no more than 50 items per"
            - "optimal batch size is"
        - kind: no_secrets
